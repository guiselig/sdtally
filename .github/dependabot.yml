# Atualizações semanais das dependências do Cargo e das actions (estas fixadas por SHA).
version: 2
updates:
  - package-ecosystem: cargo
    # frenteQ é compilado pelo job `fontes` do CI.
    directories: ["/", "/research/experimentos/frenteQ"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
